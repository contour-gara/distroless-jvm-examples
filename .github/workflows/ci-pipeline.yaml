name: CI Pipeline

on:
  push:
    branches:
      - 'main'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: mise install
        uses: jdx/mise-action@v4
      - name: Run unit test
        run: gradle clean app:test
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: mise install
        uses: jdx/mise-action@v4
      - name: Build app
        run: gradle clean app:bootBuildImage
      - name: Run integration test
        run: gradle integration-test:integrationTest
